<div class="card shadow-sm border-0 mb-5">

    <div class="card-body">

        <h5 class="mb-3">
            Leave a Comment
        </h5>

        <div id="comment-message"></div>

        <form
            id="comment-form"
            method="POST"
            action="{% url 'post_comment' article.slug %}">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">
                    {{ form.name.label_tag }}
                    {{ form.name }}
                </div>

                <div class="col-md-6 mb-3">
                    {{ form.email.label_tag }}
                    {{ form.email }}
                </div>

            </div>

            <div class="mb-3">
                {{ form.content.label_tag }}
                {{ form.content }}
            </div>

            <button class="btn btn-primary rounded-pill px-4">

                <i class="bi bi-send-fill"></i>

                Post Comment

            </button>

        </form>

    </div>

</div>
